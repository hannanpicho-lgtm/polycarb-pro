# CodeQL for JavaScript/TypeScript. Interpreted languages use build-mode: none —
# do NOT use autobuild for Next.js (it mis-triggers a full production build and is unsupported here).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Run manually: Actions → CodeQL → Run workflow
  schedule:
    - cron: '12 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      HUSKY: '0'

    steps:
      - name: Checkout + Node + npm ci
        uses: ./.github/actions/setup-node-project

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Required for JS/TS: analyze source + resolve imports without `next build`
          # (autobuild is for compiled languages and is wrong for this repo).
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
