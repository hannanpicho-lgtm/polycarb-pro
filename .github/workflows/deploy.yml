name: Deploy Production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

concurrency:
  group: deploy-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://covestroppc.com

    permissions:
      contents: read
      deployments: write
    env:
      HUSKY: '0'

    steps:
      - name: Checkout + Node + npm ci
        uses: ./.github/actions/setup-node-project

      - name: Build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time_iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build (OpenNext + Cloudflare)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_GIT_SHA: ${{ steps.meta.outputs.sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ steps.meta.outputs.time_iso }}
          NEXT_PUBLIC_SITE_URL: https://covestroppc.com
        run: npm run cf:build

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.83.0'
          command: deploy

      - name: Smoke test production APIs
        run: |
          set -euo pipefail
          sleep 8
          curl --fail --retry 8 --retry-delay 4 --max-time 20 https://covestroppc.com/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --retry 8 --retry-delay 4 --max-time 20 https://covestroppc.com/api/version | tee /tmp/version.json
          grep -q '"ok":true' /tmp/version.json

      - name: Verify deployed commit matches pushed commit
        run: |
          set -euo pipefail
          expected="${{ steps.meta.outputs.sha }}"
          expected_short="${expected:0:12}"
          actual="$(node -e "const fs=require('node:fs'); const o=JSON.parse(fs.readFileSync('/tmp/version.json','utf8')); process.stdout.write(String(o.commit ?? '').trim());")"
          if [ -z "$actual" ] || [ "$actual" = "local" ]; then
            echo "Deployment verification failed: /api/version commit is '$actual'."
            exit 1
          fi
          case "$expected_short" in
            "$actual"*) ;;
            *)
              echo "Deployment verification failed: expected prefix '$expected_short', got '$actual'."
              exit 1
              ;;
          esac

      - name: Summary
        if: always()
        run: |
          echo "### Production Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${{ steps.meta.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor**: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: https://covestroppc.com" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/version.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**/api/version response:**" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/version.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
