name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check:all + OpenNext (Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HUSKY: '0'

    steps:
      - name: Checkout + Node + npm ci
        uses: ./.github/actions/setup-node-project

      - name: Cache Next.js (compile) cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '**/*.mjs', '**/*.cjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: check:all (type-check, ESLint, Prettier)
        run: npm run check:all
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Set build time (for NEXT_PUBLIC)
        id: build_meta
        run: echo "time_iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: OpenNext + Cloudflare build (match deploy)
        run: npm run cf:build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ steps.build_meta.outputs.time_iso }}
          NEXT_PUBLIC_SITE_URL: https://covestroppc.com

  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUSKY: '0'

    steps:
      - name: Checkout + Node + npm ci
        uses: ./.github/actions/setup-node-project

      - name: Run Vitest
        run: npm run test:ci

      - name: Coverage in job summary
        if: success()
        run: node scripts/write-vitest-coverage-summary.mjs

  audit:
    name: npm audit (high+ gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUSKY: '0'

    steps:
      - name: Checkout + Node + npm ci
        uses: ./.github/actions/setup-node-project

      - name: Advisory counts in job summary
        run: node scripts/write-npm-audit-summary.mjs

      - name: Block PR on high or critical
        run: npm audit --audit-level=high
