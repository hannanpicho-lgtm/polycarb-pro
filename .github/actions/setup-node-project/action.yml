# Shared setup for Node/npm workflows. Node version is read from `.nvmrc` (keep in sync with `package.json` `engines`).
name: 'Setup Node project'
description: 'Checkout, Node (from .nvmrc), npm cache, and npm ci (HUSKY=0 on the install step)'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash
      env:
        HUSKY: '0'
