<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- SABIC - Energy Red with modern design -->
  <defs>
    <linearGradient id="sabicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee3322;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc1100;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" fill="url(#sabicBg)"/>
  
  <!-- Dynamic chevron design -->
  <g fill="white" opacity="0.95">
    <!-- Left chevron -->
    <polygon points="50,80 70,100 50,120"/>
    <!-- Center chevron -->
    <polygon points="85,60 105,80 85,100"/>
    <!-- Right chevron -->
    <polygon points="120,80 140,100 120,120"/>
  </g>
  
  <!-- Top accent bar -->
  <rect x="30" y="30" width="140" height="8" fill="white" opacity="0.7" rx="2"/>
</svg>