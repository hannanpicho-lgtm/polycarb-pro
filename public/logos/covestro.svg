<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Covestro - Brand Blue with geometric design -->
  <defs>
    <linearGradient id="covestroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004499;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" fill="url(#covestroBg)"/>
  
  <!-- Geometric elements representing material/structure -->
  <g fill="white" opacity="0.95">
    <!-- Top left -->
    <rect x="30" y="30" width="45" height="45" rx="3"/>
    <!-- Top right -->
    <rect x="95" y="30" width="45" height="45" rx="3"/>
    <!-- Bottom left -->
    <rect x="30" y="95" width="45" height="45" rx="3"/>
    <!-- Bottom right -->
    <rect x="95" y="95" width="45" height="45" rx="3"/>
  </g>
  
  <!-- Center accent -->
  <circle cx="100" cy="100" r="8" fill="white" opacity="0.8"/>
</svg>