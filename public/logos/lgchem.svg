<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- LG Chem - Energy Orange-Red -->
  <defs>
    <linearGradient id="lgchemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6633;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dd4411;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" fill="url(#lgchemBg)"/>
  
  <!-- Circular/molecular structure representing chemistry -->
  <g fill="white" opacity="0.95">
    <!-- Central circle -->
    <circle cx="100" cy="100" r="12"/>
    <!-- Connecting dots around -->
    <circle cx="100" cy="50" r="10"/>
    <circle cx="145" cy="125" r="10"/>
    <circle cx="100" cy="150" r="10"/>
    <circle cx="55" cy="125" r="10"/>
    <!-- Connection lines -->
    <line x1="100" y1="60" x2="100" y2="88" stroke="white" stroke-width="3" opacity="0.8"/>
    <line x1="130" y1="115" x2="145" y2="125" stroke="white" stroke-width="3" opacity="0.8"/>
    <line x1="100" y1="140" x2="100" y2="112" stroke="white" stroke-width="3" opacity="0.8"/>
    <line x1="70" y1="115" x2="55" y2="125" stroke="white" stroke-width="3" opacity="0.8"/>
  </g>
</svg>